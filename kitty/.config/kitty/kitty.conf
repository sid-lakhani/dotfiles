# Kitty Configuration — Matched 1:1 with Caelestia Foot setup

# Shell (matches foot default)
shell fish

# Window Geometry (disable remembering fullscreen/maximized state)
remember_window_size  no
initial_window_width  800
initial_window_height 500

# Theme Colors (dynamically synced from wallpaper)
include ./colors.conf

# Typography
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Geometry & Padding (matches foot pad=25x25)
window_padding_width 25
hide_window_decorations yes
confirm_os_window_close 0

# Transparency & Blur
background_opacity         0.78
background_blur            1
dynamic_background_opacity yes

# Cursor (matches foot beam style)
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 10000

# Audio Bell
enable_audio_bell no

# URL handling
url_style curly
open_url_with default

# Keybindings
map ctrl+shift+f  show_scrollback
map page_up       scroll_page_up
map page_down     scroll_page_down
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard

# Modern smooth scroll
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 3.0
